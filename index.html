<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LGS Deneme Analiz & Öğrenci Arşivi</title>
    <meta
      name="description"
      content="Toplu LGS deneme sonuç PDF ve Excel dosyalarını otomatik okuyarak her öğrenci için ders bazlı doğru, yanlış, boş, net arşivi, çoklu deneme karşılaştırma grafikleri ve kazanım eksikleri analizi sunan okul takip uygulaması."
    />
    <meta property="og:title" content="LGS Deneme Analiz & Öğrenci Arşivi" />
    <meta
      property="og:description"
      content="Toplu LGS deneme sonuç PDF ve Excel dosyalarını otomatik okuyarak her öğrenci için ders bazlı doğru, yanlış, boş, net arşivi, çoklu deneme karşılaştırma grafikleri ve kazanım eksikleri analizi sunan okul takip uygulaması."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1D4ED8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LGS Analiz" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"
    />
  </head>
  <body class="bg-[#F8FAFC] text-[#0F172A] antialiased selection:bg-[#1E40AF]/15 selection:text-[#1E3A8A]">
    <section id="app-startup" aria-label="LGS Deneme Analiz" style="box-sizing:border-box;max-width:32rem;margin:12vh auto;padding:1.25rem;font:1rem/1.5 system-ui,sans-serif">
      <h1 style="font-size:1.5rem;margin:0 0 .5rem">LGS Deneme Analiz</h1>
      <p id="app-startup-message" role="status">Uygulama yükleniyor…</p>
      <p><a id="app-startup-retry" href="" hidden style="color:#1d4ed8">Yeniden dene</a></p>
      <noscript>
        <style>#app-startup-message { display: none }</style>
        <p>Uygulamayı açmak için tarayıcınızda JavaScript’i etkinleştirin.</p>
      </noscript>
    </section>
    <div id="root"></div>
    <script>
      (function () {
        var root = document.getElementById('root');
        var startup = document.getElementById('app-startup');
        var message = document.getElementById('app-startup-message');
        var retry = document.getElementById('app-startup-retry');
        function showRecovery() {
          if (root.firstElementChild) return;
          message.textContent = 'Uygulama henüz açılamadı. Bağlantınızı kontrol edip yeniden deneyin.';
          retry.hidden = false;
        }
        var timer = window.setTimeout(showRecovery, 12000);
        window.addEventListener('error', function (event) {
          if (event.error || (event.target.tagName === 'SCRIPT' && event.target.type === 'module')) {
            showRecovery();
          }
        }, true);
        var observer = new MutationObserver(function () {
          if (!root.firstElementChild) return;
          window.clearTimeout(timer);
          observer.disconnect();
          startup.remove();
        });
        observer.observe(root, { childList: true });
        retry.addEventListener('click', function (event) {
          event.preventDefault();
          window.location.reload();
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
